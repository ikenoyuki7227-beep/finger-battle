const parts={shooter:[{id:'s0',name:'ベーシックシューター',hp:80,st:40,cost:0},{id:'s1',name:'ドラゴンシューター',hp:100,st:50,cost:110},{id:'s2',name:'プラチナシューター',hp:84,st:66,cost:170},{id:'s3',name:'イナズマシューター',hp:76,st:74,cost:230},{id:'s4',name:'チェーンシューター',hp:90,st:60,cost:290}],body:[{id:'b0',name:'ベーシックボディ',def:36,skill:'none',cost:0},{id:'b1',name:'ダークボディ',def:40,skill:'blast',cost:130},{id:'b2',name:'メタルボディ',def:46,skill:'shield',cost:220},{id:'b3',name:'アイスボディ',def:43,skill:'heal',cost:280},{id:'b4',name:'マグマボディ',def:42,skill:'rage',cost:350}],weapon:[{id:'w0',name:'ベーシックエフェクト',atk:55,dex:10,cost:0},{id:'w1',name:'ファイヤーエフェクト',atk:70,dex:15,cost:130},{id:'w2',name:'ウッドエフェクト',atk:64,dex:21,cost:180},{id:'w3',name:'ロックエフェクト',atk:66,dex:19,cost:240},{id:'w4',name:'ゴーストエフェクト',atk:60,dex:25,cost:320}]};const skillNames={none:'スキルなし',blast:'相手の最大HP20%ダメージ',heal:'最大HP30%回復',rage:'5秒間攻撃力1.5倍',shield:'5秒間ダメージ無効'};const key='spinbreakers-save-v1';let save;try{save=JSON.parse(localStorage.getItem(key))}catch(e){}save=save||{stage:1,coins:0,owned:['s0','b0','w0'],chosen:{shooter:'s0',body:'b0',weapon:'w0'}};let active=false,p,e,last=0,particles=[],cooldown=0;const $=id=>document.getElementById(id),canvas=$('arena'),ctx=canvas.getContext('2d');function persist(){localStorage.setItem(key,JSON.stringify(save))}function get(t){return parts[t].find(x=>x.id===save.chosen[t])}function build(){const s=get('shooter'),b=get('body'),w=get('weapon');return{max:s.hp*3,hp:s.hp*3,st:s.st,def:b.def,atk:w.atk,dex:w.dex,skill:b.skill,visual:{shooter:s.id,body:b.id,weapon:w.id},x:165,y:245,vx:2.8,vy:0,angle:0,spin:0,boost:0,shield:0,charge:0,jump:0,jumpCD:0,r:39,color:'#27ccff'}}function foe(){let n=save.stage;return{max:190+n*30,hp:190+n*30,st:35+n*5,def:31+n*2.2,atk:51+n*2.7,dex:9+n*1.6,visual:{shooter:'s0',body:'b0',weapon:'w0'},x:555,y:245,vx:-2.8-n*.07,vy:0,angle:0,spin:0,boost:0,shield:0,charge:0,jump:0,jumpCD:0,r:39,color:'#ff465e'}}function ui(){ $('stage').textContent='STAGE '+save.stage+' / 10';$('coins').textContent='🪙 '+save.coins;$('ename').textContent='RIVAL '+save.stage;for(const t of Object.keys(parts)){let el=$(t);el.innerHTML=parts[t].filter(x=>save.owned.includes(x.id)).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');el.value=save.chosen[t];el.disabled=active}let z=build();$('buildstats').innerHTML=`<b>HP ${z.max}　攻撃 ${z.atk}　守備 ${z.def}　安定 ${z.st}　器用 ${z.dex}</b><p class="highlight">固有スキル：${skillNames[z.skill]}</p>`;$('shop').innerHTML=Object.keys(parts).flatMap(t=>parts[t].filter(x=>x.cost).map(x=>`<div class="item"><b>${x.name}</b><div class="muted">${t==='shooter'?`HP +${x.hp} / 安定 +${x.st}`:t==='body'?`守備 +${x.def} / ${skillNames[x.skill]}`:`攻撃 +${x.atk} / 器用 +${x.dex}`}</div><button data-id="${x.id}" data-type="${t}" ${active||save.owned.includes(x.id)||save.coins<x.cost?'disabled':''}>${save.owned.includes(x.id)?'購入済み':'🪙 '+x.cost}</button></div>`)).join('');document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=()=>{let x=parts[btn.dataset.type].find(x=>x.id===btn.dataset.id);if(active||save.coins<x.cost)return;save.coins-=x.cost;save.owned.push(x.id);save.chosen[btn.dataset.type]=x.id;persist();ui()});$('fight').disabled=active;$('skill').disabled=!active||!p||p.skill==='none'||p.charge<100;$('jump').disabled=!active||!p||p.jumpCD>0||p.hp<=13; if(p&&e){$('php').style.width=Math.max(0,p.hp/p.max*100)+'%';$('ehp').style.width=Math.max(0,e.hp/e.max*100)+'%';$('ptxt').textContent=Math.ceil(Math.max(0,p.hp))+' / '+p.max;$('etxt').textContent=Math.ceil(Math.max(0,e.hp))+' / '+e.max}}Object.keys(parts).forEach(t=>$(t).onchange=ev=>{save.chosen[t]=ev.target.value;persist();ui()});function launch(){p=build();e=foe();active=true;cooldown=0;particles=[];$('log').textContent='3、2、1… GO SHOOT!';ui()}$('fight').onclick=launch;$('retry').onclick=()=>{if(!confirm('進行状況と購入パーツを初期化しますか？'))return;localStorage.removeItem(key);location.reload()};$('jump').onclick=()=>{if(!active||p.jumpCD>0||p.hp<=13)return;p.hp-=12;p.jump=.9;p.jumpCD=4;burst(p.x,p.y,'#9feeff');$('log').textContent='🪽 ジャンプ！ 空中で衝突攻撃を回避！';ui()};$('skill').onclick=()=>{if(!active||p.skill==='none'||p.charge<100)return;p.charge=0;if(p.skill==='blast'){e.hp-=e.max*.2;$('log').textContent='🔥 ドラゴンブレイク！ 20%ダメージ！'}if(p.skill==='heal'){p.hp=Math.min(p.max,p.hp+p.max*.3);$('log').textContent='✨ フェニックスヒール！ 30%回復！'}if(p.skill==='rage'){p.boost=5;$('log').textContent='⚡ バーサーク！ 攻撃力1.5倍！'}if(p.skill==='shield'){p.shield=5;$('log').textContent='🛡 イージスバリア！ 5秒間無敵！'}burst(p.x,p.y,'#ffe66d');ui()};function burst(x,y,color){for(let i=0;i<18;i++)particles.push({x,y,vx:(Math.random()-.5)*11,vy:(Math.random()-.5)*11,life:25,color})}function hit(a,b){const crit=Math.random()<Math.min(.5,a.dex*.008);let dmg=Math.max(1,(a.atk*(a.boost>0?1.5:1)*(crit?1.5:1)-b.def*(crit?.5:1))*(.82+Math.random()*.36));if(b.shield>0||b.jump>0)dmg=0;b.hp-=dmg;a.charge=Math.min(100,a.charge+22);if(crit)$('log').textContent='💥 CRITICAL HIT! '+Math.round(dmg)+'ダメージ';burst((a.x+b.x)/2,(a.y+b.y)/2,crit?'#ffe95e':'#a7f4ff')}function finish(win){active=false;if(win){let prize=65+save.stage*35;save.coins+=prize;if(save.stage<10){$('log').textContent=`🏆 勝利！ +${prize}コイン獲得！ 次のステージ解放！`;save.stage++}else $('log').textContent=`👑 全10ステージ制覇！ +${prize}コイン！ 再挑戦も可能！`}else $('log').textContent='💀 敗北… パーツを強化して再挑戦！';persist();ui()}function update(dt){if(!active)return;for(let o of [p,e]){o.angle+=dt*(o===p?14:-15);o.boost=Math.max(0,o.boost-dt);o.jump=Math.max(0,(o.jump||0)-dt);o.jumpCD=Math.max(0,(o.jumpCD||0)-dt);o.shield=Math.max(0,o.shield-dt);o.hp-=dt*(1.2+100/(o.st+15));// Steering toward rival; center collision is intentional.
let target=o===p?e:p,tx=target.x-o.x,ty=target.y-o.y,td=Math.hypot(tx,ty)||1;
o.vx+=(tx/td)*dt*4.3;o.vy+=(ty/td)*dt*4.3;
o.vx*=Math.pow(.991,dt*60);o.vy*=Math.pow(.991,dt*60);
o.x+=o.vx*dt*60;o.y+=o.vy*dt*60;let dx=(o.x-360)/315,dy=(o.y-245)/195;if(dx*dx+dy*dy>1){o.vx*=-.9;o.vy*=-.9;o.x-=dx*5;o.y-=dy*5}o.vx+=(360-o.x)*.000012*dt*60;o.vy+=(245-o.y)*.000012*dt*60;let speed=Math.hypot(o.vx,o.vy);if(speed>4.8){o.vx*=4.8/speed;o.vy*=4.8/speed}}cooldown-=dt;let d=Math.hypot(p.x-e.x,p.y-e.y);if(d<92&&cooldown<=0){hit(p,e);hit(e,p);let nx=(p.x-e.x)/(d||1),ny=(p.y-e.y)/(d||1);p.vx=nx*2.7+(Math.random()-.5);p.vy=ny*2.7+(Math.random()-.5);e.vx=-nx*2.7+(Math.random()-.5);e.vy=-ny*2.7+(Math.random()-.5);cooldown=.65}if(p.hp<=0||e.hp<=0)finish(e.hp<=0&&p.hp>0)}function drawTop(o,c=ctx){
 const v=o.visual||{shooter:'s0',body:'b0',weapon:'w0'},si=Number(v.shooter.slice(1))||0,bi=Number(v.body.slice(1))||0,wi=Number(v.weapon.slice(1))||0;
 const palettes=[['#31a5ff','#c1f3ff'],['#6422a8','#d8aaff'],['#a8b6cc','#ffffff'],['#37b9ff','#d6ffff'],['#ff5126','#ffd36d']];
 const [base,shine]=palettes[bi],weaponColors=['#e5efff','#ff592b','#8ad35c','#b4b5c9','#a77cff'],coreColors=['#49d7ff','#25df75','#e8eaf5','#ffe24c','#ff6060'];
 const airborne=o.jump>0, lift=airborne?Math.sin((.9-o.jump)/.9*Math.PI)*27:0;
 c.save();c.translate(o.x,o.y-lift);c.scale(1.16,1.16);
 if(airborne){c.save();c.globalAlpha=.55;c.fillStyle='#b8f4ff';c.beginPath();c.ellipse(0,lift+17,38,13,0,0,Math.PI*2);c.fill();c.restore()}
 c.rotate(o.angle);c.shadowBlur=15;c.shadowColor=base;
 // Weapon: distinct outer silhouettes for every selected weapon.
 const teeth=[8,7,4,6,5][wi];c.fillStyle=weaponColors[wi];c.strokeStyle='#081526';c.lineWidth=2.5;
 for(let i=0;i<teeth;i++){c.save();c.rotate(i*Math.PI*2/teeth);c.beginPath();
 if(wi===0||wi===1){c.moveTo(-14,-31);c.lineTo(-7,-50);c.lineTo(15,-43);c.lineTo(18,-30)}
 if(wi===2){c.moveTo(-23,-29);c.lineTo(-19,-55);c.lineTo(0,-57);c.lineTo(22,-28)}
 if(wi===3){c.moveTo(-18,-31);c.lineTo(-5,-54);c.lineTo(13,-51);c.lineTo(21,-32)}

 // Elemental effects belong to the weapon and remain visible in every build.
 if(wi===1||wi===2||wi===4){for(let k=0;k<9;k++){let a=k*Math.PI*2/9, rr=53+(k%3)*4;c.save();c.rotate(a);c.strokeStyle=wi===1?'#ff5722':wi===2?'#70ff6b':'#b66aff';c.lineWidth=wi===1?4:2.5;c.shadowBlur=12;c.shadowColor=c.strokeStyle;c.beginPath();c.moveTo(0,-43);c.quadraticCurveTo(10,-rr,0,-rr-8);c.stroke();c.restore()}}

 c.beginPath();c.arc(0,0,29,0,Math.PI*2);c.fillStyle='#13233b';c.fill();c.strokeStyle=shine;c.lineWidth=3;c.stroke();
 for(let i=0;i<4+bi;i++){c.save();c.rotate(i*Math.PI*2/(4+bi));c.fillStyle=base;c.fillRect(-5,-28,10,9);c.restore()}
 // Shooter: central hub shape/color indicates launcher, visible in all combinations.
 c.beginPath();c.arc(0,0,19,0,Math.PI*2);c.fillStyle=coreColors[si];c.fill();c.strokeStyle='#ffffff';c.lineWidth=2;c.stroke();
 for(let i=0;i<3+si;i++){c.save();c.rotate(i*Math.PI*2/(3+si));c.fillStyle='#0a203a';c.fillRect(-3,-17,6,8);c.restore()}
 c.beginPath();c.arc(0,0,9+si*.7,0,Math.PI*2);c.fillStyle='#f9fdff';c.fill();c.beginPath();c.arc(0,0,5,0,Math.PI*2);c.fillStyle=coreColors[si];c.fill();c.restore();

const oldUi=ui;ui=function(){oldUi();if(document.getElementById('tab-custom').classList.contains('selected'))drawPreview()};

let currentPart='shooter';
const shortNames={shooter:'シューター',body:'ボディ',weapon:'ウエポン'};
function partDetails(t,x){return t==='shooter'?`❤️ 体力 ${x.hp}　🌀 安定 ${x.st}`:t==='body'?`🛡 守備 ${x.def}<br>✨ ${skillNames[x.skill]}`:`⚔️ 攻撃 ${x.atk}　⭐ 器用 ${x.dex}`}
function renderPartCards(){document.querySelectorAll('#customTabs button').forEach(b=>b.classList.toggle('selected',b.dataset.part===currentPart));$('partGrid').innerHTML=parts[currentPart].map(x=>{let own=save.owned.includes(x.id),eq=save.chosen[currentPart]===x.id;return `<div class="partCard ${eq?'equipped':''} ${own?'':'locked'}"><img src="${x.id}.webp" alt="${x.name}"><div class="name">${x.name}</div><div class="detail">${partDetails(currentPart,x)}</div><button data-equip="${x.id}" ${!own||active?'disabled':''}>${eq?'✓ 装備中':own?'装備する':'🔒 ショップで購入'}</button></div>`}).join('');document.querySelectorAll('[data-equip]').forEach(btn=>btn.onclick=()=>{if(active)return;save.chosen[currentPart]=btn.dataset.equip;persist();ui()})}
document.querySelectorAll('#customTabs button').forEach(b=>b.onclick=()=>{currentPart=b.dataset.part;renderPartCards()});
const priorUI=ui;ui=function(){priorUI();renderPartCards();$('shop').innerHTML=Object.keys(parts).flatMap(t=>parts[t].filter(x=>x.cost).map(x=>`<div class="item"><img src="${x.id}.webp" alt="${x.name}"><b>${x.name}</b><div class="muted">${partDetails(t,x)}</div><button data-id="${x.id}" data-type="${t}" ${active||save.owned.includes(x.id)||save.coins<x.cost?'disabled':''}>${save.owned.includes(x.id)?'購入済み':'🪙 '+x.cost}</button></div>`)).join('');document.querySelectorAll('#shop [data-id]').forEach(btn=>btn.onclick=()=>{let x=parts[btn.dataset.type].find(x=>x.id===btn.dataset.id);if(active||save.coins<x.cost)return;save.coins-=x.cost;save.owned.push(x.id);save.chosen[btn.dataset.type]=x.id;persist();ui()})};

function render(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;update(dt);ctx.clearRect(0,0,720,490);let bg=ctx.createRadialGradient(360,230,25,360,245,420);bg.addColorStop(0,'#194c7a');bg.addColorStop(.58,'#0c2449');bg.addColorStop(1,'#030a1a');ctx.fillStyle=bg;ctx.fillRect(0,0,720,490);ctx.save();ctx.translate(360,245);ctx.scale(1,.62);for(let r=305;r>60;r-=49){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle=r===305?'#4fd6ff':'#276a9a';ctx.lineWidth=r===305?9:2;ctx.stroke()}ctx.restore();ctx.strokeStyle='#1c4868';ctx.beginPath();ctx.moveTo(360,45);ctx.lineTo(360,445);ctx.moveTo(50,245);ctx.lineTo(670,245);ctx.stroke();if(!p){p=build();e=foe()}ctx.save();ctx.globalAlpha=.25;ctx.fillStyle='#16d9ff';ctx.beginPath();ctx.ellipse(p.x,p.y+33,50,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff4a39';ctx.beginPath();ctx.ellipse(e.x,e.y+33,50,13,0,0,Math.PI*2);ctx.fill();ctx.restore();drawTop(p);drawTop(e);particles.forEach(q=>{ctx.globalAlpha=q.life/25;ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,5,5);q.x+=q.vx;q.y+=q.vy;q.life--});ctx.globalAlpha=1;particles=particles.filter(q=>q.life>0);if(active){$('php').style.width=Math.max(0,p.hp/p.max*100)+'%';$('ehp').style.width=Math.max(0,e.hp/e.max*100)+'%';$('ptxt').textContent=Math.ceil(Math.max(0,p.hp))+' / '+p.max;$('etxt').textContent=Math.ceil(Math.max(0,e.hp))+' / '+e.max;$('skill').disabled=p.skill==='none'||p.charge<100;$('skill').textContent=(p.skill==='none'?'スキルなし':'🔥 スキル '+Math.floor(p.charge)+'%');$('jump').disabled=p.jumpCD>0||p.hp<=13;$('jump').textContent=p.jumpCD>0?'🪽 ジャンプ '+p.jumpCD.toFixed(1)+'秒':'🪽 ジャンプ HP-12'}requestAnimationFrame(render)}ui();requestAnimationFrame(render);
</script></body></html>
