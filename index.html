<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#14152b"><title>ゆびバトル</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#17142f,#29224c);color:white;font-family:system-ui,-apple-system,sans-serif}main{max-width:520px;margin:auto;padding:18px 15px 40px}h1{font-size:28px;margin:8px 0}h2{font-size:19px}p{color:#c8c5de}.top{display:flex;justify-content:space-between;align-items:center}.coin{background:#3b315a;border-radius:30px;padding:10px 14px;color:#ffd56b;font-weight:800}.panel{background:#ffffff10;border:1px solid #ffffff22;border-radius:22px;padding:16px;margin:15px 0}.tabs,.modes,.skills,.hands,.shop{display:flex;gap:9px;flex-wrap:wrap}button{border:0;border-radius:15px;padding:12px 14px;background:#494165;color:white;font-weight:750;cursor:pointer}button.active{background:#ffb95e;color:#23172a}button:disabled{opacity:.35}.hand{flex:1;min-width:105px;min-height:120px;background:#ffffff12;border:2px solid #ffffff20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px}.hand .emoji{font-size:40px}.hand .number{font-size:24px;font-weight:900}.hand.selected{border-color:#ffd36d;background:#5a4661}.hand.dead{opacity:.3}.enemy{border-color:#e48ba455}.status{background:#211d3c;border-radius:12px;padding:13px;text-align:center;margin:14px 0;color:#ffe0a1;font-weight:700}.primary{background:linear-gradient(100deg,#ffb75b,#ff7f85);color:#231629;width:100%;font-size:17px;padding:15px}.small{font-size:12px;color:#bbb4d0}.shop button{flex:1;min-width:130px}.hidden{display:none}.tag{font-size:12px;background:#51436a;border-radius:12px;padding:4px 8px}.footer{text-align:center;color:#a5a0bc;font-size:12px;margin-top:24px}</style></head><body><main><div class="top"><h1>✌️ ゆびバトル</h1><span class="coin">🪙 <span id="coins">0</span></span></div><div class="tabs"><button id="battleTab" class="active" onclick="tab('battle')">⚔️ バトル</button><button id="shopTab" onclick="tab('shop')">💅 ショップ</button></div><section id="battle"><div class="panel"><h2>🎮 対戦モード</h2><div class="modes" id="modes"></div><p class="small" id="modeDesc"></p><button class="primary" onclick="start()">新しい対戦を始める</button></div><div class="panel"><div class="top"><h2>敵チーム</h2><span class="tag" id="turnLabel">あなたのターン</span></div><div id="enemies"></div><div class="status" id="status">モードを選んで対戦開始！</div><h2>🙌 あなたの手</h2><div class="hands" id="player"></div><p class="small">①自分の手を選ぶ → ②相手の手をタップして攻撃！</p></div><div class="panel"><h2>✨ 必殺技 <span class="tag" id="skillLeft">残り1回</span></h2><div class="skills" id="skills"></div><p class="small">必殺技を選んだら、対象の手をタップ。全体攻撃はすぐ発動します。</p></div></section><section id="shopPage" class="hidden"><div class="panel"><h2>💅 カスタマイズショップ</h2><p>勝利コインで装飾をゲット！購入後はタップして装備できるよ。</p><div class="shop" id="shop"></div></div></section><div class="footer">ゆびバトル · テスト版 v0.1</div></main><script>
const modes=[['normal','ふつう','1対1・全員1本ずつ'],['triple','三つ巴','1対1対1・CPU同士も攻撃'],['three','強敵3本','敵の両手が3本から開始'],['weak','逆境','自分は左手1本のみ・敵は通常'],['two','敵2本','敵の両手が2本から開始']];const items=[['plain','装飾なし',0,'✋'],['pink','ピンクネイル',15,'💅'],['ring','キラキラ指輪',25,'💍'],['star','スターオーラ',40,'🌟']];let coins=Number(localStorage.getItem('yb_coins')||0),owned=JSON.parse(localStorage.getItem('yb_owned')||'["plain"]'),equipped=localStorage.getItem('yb_equipped')||'plain',mode='normal',teams=[],turn=0,selected=null,skill=null,used=false,over=false,busy=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem('yb_coins',coins);localStorage.setItem('yb_owned',JSON.stringify(owned));localStorage.setItem('yb_equipped',equipped)}function tab(t){$('battle').classList.toggle('hidden',t!=='battle');$('shopPage').classList.toggle('hidden',t!=='shop');$('battleTab').classList.toggle('active',t==='battle');$('shopTab').classList.toggle('active',t==='shop');render()}function chooseMode(m){mode=m;renderModes()}function renderModes(){$('modes').innerHTML=modes.map(x=>`<button class="${mode===x[0]?'active':''}" onclick="chooseMode('${x[0]}')">${x[1]}</button>`).join('');$('modeDesc').textContent=modes.find(x=>x[0]===mode)[2]}function start(){let mine=mode==='weak'?[1,0]:[1,1],enemy=mode==='three'?[3,3]:mode==='two'?[2,2]:[1,1];teams=[{name:'あなた',hands:mine},{name:'CPU 1',hands:enemy}];if(mode==='triple')teams.push({name:'CPU 2',hands:[1,1]});turn=0;selected=null;skill=null;used=false;over=false;busy=false;message('あなたの番！攻撃する手を選んでね');render()}function alive(t){return t.hands.some(n=>n>0)}function remaining(){return teams.filter(alive)}function calc(a,b){let n=a+b;return n===5?0:n>5?n-5:n}function message(s){$('status').textContent=s}function handIcon(n){return n===0?'✊':n===1?'☝️':n===2?'✌️':n===3?'🤟':n===4?'🖖':'🖐️'}function drawHand(t,i,isPlayer){let n=t.hands[i],sel=selected&&selected[0]===teams.indexOf(t)&&selected[1]===i;let ornament=isPlayer&&n>0?(equipped==='pink'?'💅':equipped==='ring'?'💍':equipped==='star'?'🌟':''):'';return `<button class="hand ${isPlayer?'':'enemy'} ${sel?'selected':''} ${n===0?'dead':''}" ${n===0||over||busy?'disabled':''} onclick="tap(${teams.indexOf(t)},${i})"><span class="emoji">${handIcon(n)}</span><span class="number">${n} ${ornament}</span><span>${i===0?'左手':'右手'}</span></button>`}function render(){if(!teams.length)return; $('coins').textContent=coins;$('turnLabel').textContent=over?'終了':turn===0?'あなたのターン':'CPUのターン';$('enemies').innerHTML=teams.slice(1).map(t=>`<div><p>${t.name} ${alive(t)?'':'💀 脱落'}</p><div class="hands">${t.hands.map((_,i)=>drawHand(t,i,false)).join('')}</div></div>`).join('');$('player').innerHTML=teams[0].hands.map((_,i)=>drawHand(teams[0],i,true)).join('');$('skillLeft').textContent=used?'使用済み':'残り1回';$('skills').innerHTML=[['plus','➕ +1'],['minus','➖ -1'],['clone','👥 分身'],['area','💥 全体攻撃']].map(([id,label])=>`<button class="${skill===id?'active':''}" ${used||over||turn!==0||busy?'disabled':''} onclick="selectSkill('${id}')">${label}</button>`).join('');renderShop()}function selectSkill(s){if(used||over||busy||turn!==0)return;skill=skill===s?null:s;selected=null;if(skill==='area'){let source=teams[0].hands.find(n=>n>0);if(!source){skill=null;return}teams.slice(1).filter(alive).forEach(t=>t.hands=t.hands.map(n=>n>0?calc(source,n):0));used=true;skill=null;message(`💥 全体攻撃！ 自分の${source}本で敵の生きている全ての手を攻撃！`);finishTurn();return}message(skill==='clone'?'分身させたい自分の手を選んでね（空いている手が必要）':skill==='plus'?'1増やす自分の手を選んでね':'1減らす自分の手を選んでね');render()}function tap(t,i){if(over||busy||turn!==0||!teams[t]||teams[t].hands[i]===0)return;if(skill){if(t!==0){message('必殺技は自分の手を選んでね');return}let h=teams[0].hands;if(skill==='plus')h[i]=calc(1,h[i]);else if(skill==='minus')h[i]=Math.max(0,h[i]-1);else if(skill==='clone'){let other=1-i;if(h[other]!==0){message('分身は反対の手が0本のときだけ使えるよ');return}h[other]=h[i]}used=true;message('✨ 必殺技発動！');skill=null;finishTurn();return}if(t===0){selected=[t,i];message(`${teams[0].hands[i]}本の手を選択！敵の手をタップしてね`);render();return}if(!selected){message('先に自分の手を選んでね');return}let power=teams[0].hands[selected[1]],before=teams[t].hands[i];teams[t].hands[i]=calc(power,before);selected=null;message(`${power}本で攻撃！ ${before} → ${teams[t].hands[i]}本`);finishTurn()}function finishTurn(){render();if(checkEnd())return;busy=true;render();setTimeout(cpuSequence,650)}function checkEnd(){if(!alive(teams[0])){over=true;message('💀 負けちゃった！もう一度挑戦しよう');render();return true}if(teams.slice(1).every(t=>!alive(t))){over=true;let reward=mode==='triple'?30:mode==='normal'?10:20;coins+=reward;save();message(`🏆 勝利！ 🪙 ${reward}コイン獲得！`);render();return true}return false}function cpuSequence(){let ids=teams.map((t,i)=>i).filter(i=>i>0&&alive(teams[i]));for(let id of ids){if(over)break;let targets=teams.map((t,i)=>i).filter(i=>i!==id&&alive(t));if(!targets.length)break;let target=targets[Math.floor(Math.random()*targets.length)];let src=teams[id].hands.map((n,i)=>n>0?i:-1).filter(i=>i>=0);let dst=teams[target].hands.map((n,i)=>n>0?i:-1).filter(i=>i>=0);if(!src.length||!dst.length)continue;let a=src[Math.floor(Math.random()*src.length)],b=dst[Math.floor(Math.random()*dst.length)];let power=teams[id].hands[a];teams[target].hands[b]=calc(power,teams[target].hands[b]);message(`${teams[id].name}が${teams[target].name}に${power}本で攻撃！`);if(checkEnd())break}busy=false;turn=0;render()}function renderShop(){$('coins').textContent=coins;$('shop').innerHTML=items.map(([id,name,cost,emoji])=>`<button class="${equipped===id?'active':''}" onclick="buy('${id}')">${emoji} ${name}<div class="small">${equipped===id?'装備中':owned.includes(id)?'装備する':`🪙 ${cost}`}</div></button>`).join('')}function buy(id){let item=items.find(x=>x[0]===id);if(!owned.includes(id)){if(coins<item[2]){alert('コインが足りないよ！バトルで集めよう');return}coins-=item[2];owned.push(id)}equipped=id;save();render()}renderModes();start();</script></body></html>
